name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and run every check
        run: npm run verify

      - name: Upload failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: |
            .snapshots/diff
            out
          if-no-files-found: ignore
          retention-days: 7
